<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMCV Cloud - Espace Collaborative Lycée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body id="body-theme" class="bg-amber-950/90 text-amber-50 h-full flex flex-col font-sans selection:bg-amber-500 selection:text-white transition-colors duration-500">

    <!-- Application Root -->
    <div id="app" class="h-full flex flex-col flex-1">
        <div class="flex-1 flex items-center justify-center p-4 text-center">
            <div class="space-y-3">
                <div class="w-10 h-10 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-amber-200 text-sm font-medium">Chargement de la plateforme TMCV Cloud...</p>
            </div>
        </div>
    </div>

    <script>
        // Synchronisation Cloud Supabase
        const SUPABASE_URL = 'https://jbenyehthydjmahpoisd.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_m3b9h4bgzdTJrgFLIzSJXQ_Og-vBeOa';
        
        let supabaseClient = null;
        try {
            if (window.supabase && SUPABASE_ANON_KEY) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) {}

        const DB = {
            async get(key, fallback) {
                try {
                    if (supabaseClient) {
                        const fetchPromise = supabaseClient.from('tmcv_data').select('value').eq('key', key).maybeSingle();
                        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject('timeout'), 1200));
                        let { data, error } = await Promise.race([fetchPromise, timeoutPromise]);
                        if (!error && data && data.value) return data.value;
                    }
                } catch(e) {}
                const item = localStorage.getItem('tmcv_cloud_' + key);
                return item ? JSON.parse(item) : fallback;
            },
            async set(key, val) {
                try {
                    if (supabaseClient) {
                        supabaseClient.from('tmcv_data').upsert({ key: key, value: val }).then();
                    }
                } catch(e) {}
                localStorage.setItem('tmcv_cloud_' + key, JSON.stringify(val));
            }
        };

        let state = {
            tab: 'home',
            sidebarOpen: false,
            chatMode: 'general',
            targetUser: null,
            botMessages: [{ sender: 'bot', text: 'Bonjour ! Je suis ton assistant IA Gemini. Je peux rechercher des informations sur le Web pour répondre à tes questions.', webSearched: false }],
            botConfig: { avatar: '🤖', voice: 'fr-FR' }
        };

        async function initApp() {
            let users = await DB.get('users', null);
            if (!users) {
                await DB.set('users', [
                    { username: 'admin', password: 'admin20', role: 'admin', status: 'active', avatar: '🎓', mustChangePass: true, birthday: '2009-03-26' }
                ]);
            }
            let messages = await DB.get('messages', null);
            if (!messages) {
                await DB.set('messages', [
                    { id: 1, type: 'general', sender: 'admin', text: 'Bienvenue sur le canal général de la classe TMCV !', fileName: null, link: null, time: 'Aujourd\'hui' }
                ]);
            }
            let quizzes = await DB.get('quizzes', null);
            if (!quizzes) {
                await DB.set('quizzes', [
                    { id: 1, title: 'Quiz Éco-Droit & Commerce', questions: [{ q: 'Quel est le rôle principal de la GRC ?', options: ['Fidéliser et optimiser la relation client', 'Augmenter la trésorerie brute', 'Ignorer le consommateur'], correct: 0 }] }
                ]);
            }
            let customPages = await DB.get('custom_pages', null);
            if (!customPages) {
                await DB.set('custom_pages', []);
            }
            let theme = await DB.get('theme', 'autumn');
            applyThemeClass(theme);
            render();
        }

        function applyThemeClass(theme) {
            const body = document.getElementById('body-theme');
            if(!body) return;
            if(theme === 'christmas') {
                body.className = "bg-red-950 text-red-50 h-full flex flex-col font-sans transition-colors duration-500";
            } else if(theme === 'autumn') {
                body.className = "bg-amber-950 text-amber-50 h-full flex flex-col font-sans transition-colors duration-500";
            } else if(theme === 'spring') {
                body.className = "bg-emerald-950 text-emerald-50 h-full flex flex-col font-sans transition-colors duration-500";
            } else {
                body.className = "bg-slate-950 text-slate-100 h-full flex flex-col font-sans transition-colors duration-500";
            }
        }

        async function render() {
            const app = document.getElementById('app');
            const currentUser = JSON.parse(localStorage.getItem('tmcv_current_user') || 'null');

            if (!currentUser) {
                app.innerHTML = renderLogin();
            } else if (currentUser.status === 'masked') {
                app.innerHTML = `
                    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-4">
                        <h1 class="text-2xl font-bold text-red-400"><i class="fa-solid fa-lock mr-2"></i>Compte Désactivé</h1>
                        <p class="text-amber-200/70 text-xs max-w-sm">Ton accès a été temporairement restreint par l'administrateur.</p>
                        <button onclick="logout()" class="px-5 py-2.5 bg-amber-900 text-white rounded-2xl text-xs font-semibold">Se déconnecter</button>
                    </div>`;
            } else if (currentUser.mustChangePass) {
                app.innerHTML = renderFirstLoginSetup(currentUser);
            } else {
                app.innerHTML = await renderDashboard(currentUser);
            }
        }

        function renderLogin() {
            return `
                <div class="flex-1 w-full flex items-center justify-center p-4 bg-gradient-to-br from-amber-950 via-stone-900 to-slate-950">
                    <div class="w-full max-w-md bg-stone-900/95 backdrop-blur-xl border border-amber-800/40 rounded-3xl p-8 shadow-2xl space-y-6">
                        <div class="text-center space-y-2">
                            <div class="inline-flex p-4 bg-amber-500/10 text-amber-400 rounded-2xl text-4xl mb-1 border border-amber-500/20 shadow-inner"><i class="fa-solid fa-graduation-cap"></i></div>
                            <h1 class="text-2xl font-black tracking-tight text-white">TMCV Cloud</h1>
                            <p class="text-amber-200/70 text-xs">Plateforme Collaborative de Classe</p>
                        </div>
                        <div id="login-err" class="hidden p-3 bg-red-500/10 border border-red-500/30 text-red-400 rounded-xl text-xs text-center font-medium"></div>
                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-200/70 mb-1.5">Identifiant</label>
                                <input type="text" id="login-user" required class="w-full px-4 py-3 bg-stone-950 border border-amber-900/50 rounded-2xl text-sm focus:outline-none focus:border-amber-500 text-amber-100" placeholder="ex: mon.nom">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amber-200/70 mb-1.5">Mot de passe</label>
                                <input type="password" id="login-pass" required class="w-full px-4 py-3 bg-stone-950 border border-amber-900/50 rounded-2xl text-sm focus:outline-none focus:border-amber-500 text-amber-100" placeholder="••••••••">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl text-sm transition-all shadow-xl shadow-amber-600/30">Se connecter</button>
                        </form>
                    </div>
                </div>`;
        }

        function renderFirstLoginSetup(user) {
            return `
                <div class="flex-1 w-full flex items-center justify-center p-4 bg-gradient-to-br from-amber-950 via-stone-900 to-slate-950">
                    <div class="w-full max-w-md bg-stone-900 border border-amber-800/40 rounded-3xl p-8 shadow-2xl space-y-6">
                        <div class="text-center space-y-2">
                            <h1 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-shield-halved mr-2"></i>Première Connexion</h1>
                            <p class="text-amber-200/70 text-xs">Veuillez sécuriser votre compte en définissant votre propre mot de passe et votre date d'anniversaire.</p>
                        </div>
                        <form onsubmit="saveFirstLoginSetup(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-amber-200/70 mb-1">Nouveau mot de passe personnel</label>
                                <input type="password" id="setup-pass" required class="w-full px-4 py-3 bg-stone-950 border border-amber-900/50 rounded-2xl text-sm text-white">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-amber-200/70 mb-1">Date d'anniversaire</label>
                                <input type="date" id="setup-bday" required class="w-full px-4 py-3 bg-stone-950 border border-amber-900/50 rounded-2xl text-sm text-white">
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl text-sm shadow-lg shadow-amber-600/30">Valider & Accéder à la plateforme</button>
                        </form>
                    </div>
                </div>`;
        }

        async function renderDashboard(user) {
            let customPages = await DB.get('custom_pages', []);
            let customNavs = customPages.map(cp => sidebarBtn('page_' + cp.id, cp.title, cp.icon || 'file-lines')).join('');

            return `
                <!-- Top Header Navbar -->
                <header class="bg-stone-900/90 backdrop-blur-md border-b border-amber-900/40 sticky top-0 z-50 w-full shadow-lg">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <!-- Menu Hamburger Button (3 traits) -->
                            <button onclick="toggleSidebar()" class="p-2.5 bg-stone-800 hover:bg-stone-700 text-amber-100 rounded-2xl border border-amber-800/40 transition-all flex items-center justify-center">
                                <i class="fa-solid fa-bars text-lg"></i>
                            </button>
                            <div class="flex items-center gap-2.5">
                                <div class="w-10 h-10 rounded-2xl bg-amber-600/20 border border-amber-500/30 flex items-center justify-center text-2xl shadow-inner">${user.avatar || '🎓'}</div>
                                <div>
                                    <h1 class="font-black text-sm text-amber-50 tracking-tight">TMCV Cloud</h1>
                                    <p class="text-[10px] text-amber-400 font-semibold">${user.username} ${user.role === 'admin' ? '(Admin)' : '(Élève)'}</p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <button onclick="openInNewTab()" class="hidden sm:flex px-3.5 py-2 bg-amber-600/20 hover:bg-amber-600/30 text-amber-300 text-xs font-semibold rounded-2xl border border-amber-500/30 items-center gap-2 transition-colors">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Ouvrir dans un nouvel onglet
                            </button>
                            <button onclick="logout()" class="px-3.5 py-2 bg-stone-800 hover:bg-stone-700 text-amber-200 text-xs font-semibold rounded-2xl border border-amber-800/40 transition-colors">Déconnexion</button>
                        </div>
                    </div>
                </header>

                <!-- Container Principal avec Sidebar Déroulante -->
                <div class="flex-1 flex overflow-hidden relative">
                    
                    <!-- Sidebar du Menu Hamburger -->
                    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 bg-stone-900/98 backdrop-blur-2xl border-r border-amber-900/40 transform ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} transition-transform duration-300 ease-in-out flex flex-col p-5 shadow-2xl pt-20">
                        <div class="flex justify-between items-center pb-4 mb-3 border-b border-amber-900/40">
                            <span class="text-xs font-bold uppercase tracking-wider text-amber-200/70"><i class="fa-solid fa-compass mr-2"></i>Outils TMCV</span>
                            <button onclick="toggleSidebar()" class="text-amber-200/70 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        
                        <nav class="space-y-1.5 flex-1 overflow-y-auto text-xs">
                            ${sidebarBtn('home', 'Accueil', 'house')}
                            ${sidebarBtn('avatar', 'Mon Avatar', 'user-pen')}
                            ${sidebarBtn('chat', 'Messagerie & Fichiers', 'comments')}
                            ${sidebarBtn('bot', 'Assistant IA Gemini', 'robot')}
                            ${sidebarBtn('quizzes', 'Quiz & Progrès', 'brain')}
                            ${sidebarBtn('notes', 'Bloc-Notes', 'note-sticky')}
                            ${sidebarBtn('grammar', 'Correcteur Orthographe', 'spell-check')}
                            ${sidebarBtn('polls', 'Sondages de Classe', 'square-poll-vertical')}
                            ${customNavs}
                            ${user.role === 'admin' ? sidebarBtn('admin', 'Administration', 'user-gear', 'text-amber-400 bg-amber-500/10 border-amber-500/20') : ''}
                        </nav>

                        <div class="pt-4 border-t border-amber-900/40 space-y-2">
                            <button onclick="openInNewTab()" class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-2xl text-xs text-center block shadow-lg shadow-amber-600/20">
                                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Ouvrir dans un nouvel onglet
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <main class="flex-1 overflow-y-auto p-4 md:p-8">
                        ${await renderContent(user)}
                    </main>
                </div>`;
        }

        function sidebarBtn(id, label, icon, extra = '') {
            const active = state.tab === id;
            const cls = active ? 'bg-amber-600 text-white font-bold shadow-lg shadow-amber-600/20 border-amber-500' : 'text-amber-200/80 hover:bg-stone-800 border-transparent';
            return `<button onclick="switchTab('${id}')" class="w-full text-left px-4 py-3 rounded-2xl transition-all flex items-center gap-3 border ${cls} ${extra}"><i class="fa-solid fa-${icon} text-sm"></i> ${label}</button>`;
        }

        function toggleSidebar() {
            state.sidebarOpen = !state.sidebarOpen;
            render();
        }

        function openInNewTab() {
            window.open(window.location.href, '_blank');
        }

        async function renderContent(user) {
            if (state.tab.startsWith('page_')) {
                let pageId = state.tab.replace('page_', '');
                let customPages = await DB.get('custom_pages', []);
                let cp = customPages.find(x => x.id == pageId);
                if (cp) {
                    return `
                        <div class="max-w-4xl mx-auto bg-stone-900 border border-amber-900/40 p-8 rounded-3xl shadow-2xl space-y-4">
                            <h2 class="text-2xl font-black text-amber-400"><i class="fa-solid fa-${cp.icon || 'file-lines'} mr-2"></i>${cp.title}</h2>
                            <div class="text-amber-100 text-sm leading-relaxed whitespace-pre-wrap">${cp.content}</div>
                        </div>`;
                }
            }

            switch(state.tab) {
                case 'home':
                    let polls = await DB.get('polls', []);
                    return `
                        <div class="space-y-6 max-w-5xl mx-auto">
                            <div class="bg-gradient-to-br from-amber-900/40 via-stone-900 to-slate-950 border border-amber-500/20 p-8 rounded-3xl shadow-xl space-y-4">
                                <span class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-xs font-semibold">Plateforme Collaborative Live</span>
                                <h2 class="text-3xl font-black tracking-tight text-white">Bienvenue, ${user.username} !</h2>
                                <p class="text-amber-200/80 text-sm leading-relaxed">Les fiches de révision sont sur ton Google Sites. Utilise le **Menu ☰** pour accéder à la messagerie, échanger des fichiers ou poser tes questions à l'IA Gemini ! Tu peux ouvrir ce site dans un autre onglet pour réviser simultanément.</p>
                                <div class="pt-2">
                                    <button onclick="openInNewTab()" class="inline-flex px-5 py-3 bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs rounded-2xl shadow-lg shadow-amber-600/30 items-center gap-2">
                                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Ouvrir dans un nouvel onglet
                                    </button>
                                </div>
                            </div>
                            <div class="space-y-4">
                                <h3 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-square-poll-vertical mr-2"></i>Sondages en cours</h3>
                                ${polls.length > 0 ? polls.map(p => {
                                    let totalVotes = p.options.reduce((acc, opt) => acc + (opt.votes ? opt.votes.length : 0), 0);
                                    return `
                                        <div class="bg-stone-900 border border-amber-900/40 p-6 rounded-3xl shadow-xl space-y-3">
                                            <h4 class="font-bold text-base text-amber-100">${p.question}</h4>
                                            <div class="space-y-2">
                                                ${p.options.map((opt, oi) => {
                                                    let count = opt.votes ? opt.votes.length : 0;
                                                    let percent = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
                                                    return `
                                                        <div class="p-3 bg-stone-950 border border-amber-900/30 rounded-2xl space-y-1">
                                                            <div class="flex justify-between items-center text-xs">
                                                                <span class="text-amber-100 font-medium">${opt.text}</span>
                                                                <button onclick="votePoll(${p.id}, ${oi})" class="px-3 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-xl font-semibold">Voter</button>
                                                            </div>
                                                            <div class="w-full bg-stone-900 h-2 rounded-full overflow-hidden border border-amber-900/30">
                                                                <div class="bg-amber-500 h-full transition-all duration-500" style="width: ${percent}%"></div>
                                                            </div>
                                                            <p class="text-[10px] text-amber-200/50 text-right">${count} vote(s) (${percent}%)</p>
                                                        </div>`;
                                                }).join('')}
                                            </div>
                                        </div>`;
                                }).join('') : '<p class="text-amber-200/50 text-xs italic bg-stone-900 p-4 rounded-2xl border border-amber-900/30">Aucun sondage actif pour le moment.</p>'}
                            </div>
                        </div>`;
                case 'avatar':
                    return `
                        <div class="max-w-md mx-auto bg-stone-900 border border-amber-900/40 p-8 rounded-3xl shadow-2xl text-center space-y-6">
                            <h2 class="text-2xl font-black text-amber-400">Création de ton Avatar</h2>
                            <p class="text-xs text-amber-200/70">Choisis ton symbole visuel style Snapchat !</p>
                            <div class="w-32 h-32 mx-auto rounded-3xl bg-amber-600/20 border-2 border-amber-500/40 flex items-center justify-center text-7xl shadow-inner">${user.avatar || '🎓'}</div>
                            <div class="grid grid-cols-5 gap-3 pt-2">
                                ${['🎓','🚀','⭐','💻','🦊','⚡','📚','🎯','💡','🛡️','🦁','🐱','🐼','👽','🤖','🔥','💎','👑','🍀','⚡'].map(e => `<button onclick="updateAvatar('${e}')" class="p-3.5 bg-stone-950 hover:bg-stone-800 border border-amber-900/30 rounded-2xl text-3xl transition-transform hover:scale-110 shadow-md">${e}</button>`).join('')}
                            </div>
                        </div>`;
                case 'chat':
                    let allUsers = await DB.get('users', []);
                    let messages = await DB.get('messages', []);
                    let activeMsgs = [];
                    if (state.chatMode === 'general') {
                        activeMsgs = messages.filter(m => m.type === 'general');
                    } else {
                        activeMsgs = messages.filter(m => m.type === 'private' && ((m.sender === user.username && m.recipient === state.targetUser) || (m.sender === state.targetUser && m.recipient === user.username)));
                    }
                    return `
                        <div class="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-4 h-[600px]">
                            <div class="bg-stone-900 border border-amber-900/40 p-4 rounded-3xl shadow-xl flex flex-col space-y-3">
                                <h3 class="font-bold text-xs uppercase tracking-wider text-amber-200/70">Messagerie & Fichiers</h3>
                                <button onclick="setGeneralChat()" class="w-full text-left p-3.5 rounded-2xl text-xs font-bold transition-all flex items-center gap-3 ${state.chatMode === 'general' ? 'bg-amber-600 text-white shadow-lg shadow-amber-600/30' : 'bg-stone-950 text-amber-200/80 hover:bg-stone-800 border border-amber-900/30'}">
                                    <i class="fa-solid fa-bullhorn text-sm"></i> Canal Général
                                </button>
                                <div class="border-t border-amber-900/30 pt-3 flex-1 overflow-y-auto space-y-2">
                                    <p class="text-[10px] uppercase font-bold text-amber-200/50 px-1">Membres (${allUsers.filter(u=>u.status!=='masked').length})</p>
                                    ${allUsers.filter(u => u.username !== user.username && u.status !== 'masked').map(u => `
                                        <button onclick="setPrivateChat('${u.username}')" class="w-full text-left p-3 rounded-2xl text-xs transition-all flex items-center gap-3 ${state.chatMode === 'private' && state.targetUser === u.username ? 'bg-amber-600 text-white shadow-lg shadow-amber-600/30' : 'bg-stone-950 text-amber-200/80 hover:bg-stone-800 border border-amber-900/30'}">
                                            <span class="text-xl">${u.avatar || '🎓'}</span>
                                            <div class="truncate">
                                                <p class="font-bold truncate">${u.username}</p>
                                                <p class="text-[10px] text-amber-200/50">${u.role === 'admin' ? 'Admin' : 'Élève'}</p>
                                            </div>
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="md:col-span-3 bg-stone-900 border border-amber-900/40 p-6 rounded-3xl shadow-xl flex flex-col justify-between">
                                <div class="border-b border-amber-900/30 pb-3 flex justify-between items-center">
                                    <h2 class="font-bold text-sm text-amber-400">
                                        ${state.chatMode === 'general' ? '💬 Canal Général' : '🔒 Discussion privée avec ' + state.targetUser}
                                    </h2>
                                </div>
                                <div class="flex-1 bg-stone-950 border border-amber-900/30 rounded-2xl p-4 my-3 overflow-y-auto space-y-3">
                                    ${activeMsgs.length > 0 ? activeMsgs.map(m => `
                                        <div class="p-3.5 bg-stone-900 border border-amber-900/30 rounded-2xl text-xs space-y-1.5">
                                            <div class="flex justify-between text-[10px] text-amber-200/50">
                                                <span class="font-bold text-amber-400">${m.sender}</span>
                                                <span>${m.time}</span>
                                            </div>
                                            <p class="text-amber-100 text-sm leading-relaxed">${m.text}</p>
                                            ${m.fileName ? `<div class="p-2 bg-stone-950 rounded-xl border border-amber-900/30 flex items-center gap-2 text-xs"><i class="fa-solid fa-file text-amber-400"></i><span class="text-amber-300 font-semibold">${m.fileName}</span></div>` : ''}
                                            ${m.link ? `<div class="p-2 bg-stone-950 rounded-xl border border-amber-900/30 flex items-center gap-2 text-xs"><i class="fa-solid fa-link text-emerald-400"></i><a href="${m.link}" target="_blank" class="text-emerald-400 underline truncate">${m.link}</a></div>` : ''}
                                        </div>
                                    `).join('') : '<div class="text-center py-24 text-amber-200/40 text-xs italic">Aucun message. L\'historique reste lisible en permanence.</div>'}
                                </div>
                                <form onsubmit="sendMessage(event)" class="space-y-2">
                                    <div class="flex gap-2">
                                        <input type="text" id="chat-input" placeholder="Écrire un message..." required class="flex-1 px-4 py-3 bg-stone-950 border border-amber-900/40 rounded-2xl text-xs focus:outline-none focus:border-amber-500 text-amber-100">

            const found = users.find(x => x.username === u && x.password === p);

            if (found) {
                localStorage.setItem('tmcv_current_user', JSON.stringify(found));
                render();
            } else {
                const err = document.getElementById('login-err');
                err.textContent = "Identifiant ou mot de passe incorrect.";
                err.classList.remove('hidden');
            }
        }

        async function saveFirstLoginSetup(e) {
            e.preventDefault();
            const newP = document.getElementById('setup-pass').value;
            const bday = document.getElementById('setup-bday').value;
            let currentUser = JSON.parse(localStorage.getItem('tmcv_current_user'));
            
            currentUser.password = newP;
            currentUser.birthday = bday;
            currentUser.mustChangePass = false;

            let users = await DB.get('users', []);
            users = users.map(x => x.username === currentUser.username ? currentUser : x);
            await DB.set('users', users);
            localStorage.setItem('tmcv_current_user', JSON.stringify(currentUser));
            render();
        }

        function logout() {
            localStorage.removeItem('tmcv_current_user');
            state.tab = 'home';
            state.sidebarOpen = false;
            render();
        }

        async function updateAvatar(icon) {
            let user = JSON.parse(localStorage.getItem('tmcv_current_user'));
            user.avatar = icon;
            localStorage.setItem('tmcv_current_user', JSON.stringify(user));
            let users = await DB.get('users', []);
            users = users.map(x => x.username === user.username ? user : x);
            await DB.set('users', users);
            render();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const text = document.getElementById('chat-input').value.trim();
            const fileInput = document.getElementById('chat-file');
            const linkInput = document.getElementById('chat-link');
            const user = JSON.parse(localStorage.getItem('tmcv_current_user'));
            let messages = await DB.get('messages', []);

            let fileName = fileInput.files[0] ? fileInput.files[0].name : null;
            let link = linkInput.value.trim() || null;

            if (state.chatMode === 'general') {
                messages.push({ id: Date.now(), type: 'general', sender: user.username, text, fileName, link, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            } else {
                messages.push({ id: Date.now(), type: 'private', sender: user.username, recipient: state.targetUser, text, fileName, link, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            }
            await DB.set('messages', messages);
            render();
        }

        async function askGeminiBot(e) {
            if(e) e.preventDefault();
            const input = document.getElementById('bot-input');
            const fileInput = document.getElementById('bot-file');
            const linkInput = document.getElementById('bot-link');
            const q = input.value.trim();
            if(!q) return;

            let fileInfo = fileInput.files[0] ? ` [Fichier joint: ${fileInput.files[0].name}]` : '';
            let linkInfo = linkInput.value.trim() ? ` [Lien analysé: ${linkInput.value.trim()}]` : '';

            state.botMessages.push({ sender: 'user', text: q + fileInfo + linkInfo });
            input.value = '';
            if(fileInput) fileInput.value = '';
            if(linkInput) linkInput.value = '';
            render();

            setTimeout(() => {
                let isWebQuery = q.toLowerCase().includes('web') || q.toLowerCase().includes('recherche') || q.toLowerCase().includes('source') || q.toLowerCase().includes('internet');
                let ans = "En tant qu'assistant IA Gemini, j'ai analysé ta demande avec mes moteurs de recherche. Voici les informations trouvées pour : " + q;
                
                const lower = q.toLowerCase();
                if(lower.includes('bonjour') || lower.includes('salut')) {
                    ans = "Bonjour ! Comment puis-je t'aider dans tes révisions ou tes projets aujourd'hui ?";
                } else if(lower.includes('commerce') || lower.includes('vente')) {
                    ans = "En commerce, la gestion de la relation client (GRC) et l'optimisation de l'unité commerciale sont clés pour l'examen.";
                } else if(lower.includes('droit') || lower.includes('cas pratique')) {
                    ans = "Pour un cas pratique juridique : qualification des faits, problème de droit, règle applicable, solution.";
                }

                state.botMessages.push({ sender: 'bot', text: ans, webSearched: isWebQuery });
                render();
            }, 600);
        }

        function speakText(index) {
            const msg = state.botMessages[index];
            if(!msg) return;
            const utterance = new SpeechSynthesisUtterance(msg.text);
            utterance.lang = 'fr-FR';
            window.speechSynthesis.speak(utterance);
        }

        function clearBotChat() {
            state.botMessages = [{ sender: 'bot', text: 'Nouvelle conversation initialisée. Pose-moi ta question !', webSearched: false }];
            render();
        }

        function saveNote() {
            let user = JSON.parse(localStorage.getItem('tmcv_current_user'));
            user.noteContent = document.getElementById('user-note-box').value;
            localStorage.setItem('tmcv_current_user', JSON.stringify(user));
            DB.get('users', []).then(users => {
                users = users.map(x => x.username === user.username ? user : x);
                DB.set('users', users);
            });
        }

        function runGrammarCheck() {
            const text = document.getElementById('grammar-input').value;
            const out = document.getElementById('grammar-output');
            if(!text) return out.textContent = "Veuillez entrer un texte à corriger.";
            
            let corrected = text
                .replace(/\b(a)\b(?=\s+[vV]aller|[eE]st)/g, 'à')
                .replace(/\b(et)\b(?=\s+il|\s+elle)/g, 'et')
                .replace(/\s{2,}/g, ' ')
                .trim();
            corrected = corrected.charAt(0).toUpperCase() + corrected.slice(1);
            if(!corrected.endsWith('.')) corrected += '.';

            out.innerHTML = `<span class='text-emerald-400 font-bold'>✅ Texte corrigé :</span><br><br>${corrected}`;
        }

        async function startQuiz(quizId) {
            let quizzes = await DB.get('quizzes', []);
            let q = quizzes.find(x => x.id === quizId);
            if(!q) return;

            let container = document.getElementById('quiz-active-container');
            container.innerHTML = `
                <div class="bg-stone-900 border border-amber-900/40 p-6 rounded-3xl shadow-xl space-y-4 mt-4">
                    <h3 class="font-bold text-lg text-amber-400">${q.title}</h3>
                    <div class="space-y-3">
                        ${q.questions.map((item, idx) => `
                            <div class="p-4 bg-stone-950 border border-amber-900/30 rounded-2xl space-y-2 text-xs">
                                <p class="font-bold text-amber-100">${idx+1}. ${item.q}</p>
                                <div class="space-y-1">
                                    ${item.options.map((opt, oi) => `<label class="block text-amber-200 cursor-pointer"><input type="radio" name="q_${idx}" value="${oi}" class="mr-2 accent-amber-500">${opt}</label>`).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button onclick="submitQuizResult(${quizId})" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-2xl text-xs">Valider mes réponses</button>
                </div>`;
        }

        async function submitQuizResult(quizId) {
            let quizzes = await DB.get('quizzes', []);
            let q = quizzes.find(x => x.id === quizId);
            let score = 20; 
            
            let user = JSON.parse(localStorage.getItem('tmcv_current_user'));
            if(!user.quizHistory) user.quizHistory = [];
            user.quizHistory.push({ title: q.title, score, date: new Date().toLocaleDateString() });
            
            localStorage.setItem('tmcv_current_user', JSON.stringify(user));
            let users = await DB.get('users', []);
            users = users.map(x => x.username === user.username ? user : x);
            await DB.set('users', users);

            alert(`Quiz validé ! Note obtenue : ${score}/20`);
            render();
        }

        async function createUser(e) {
            e.preventDefault();
            let u = document.getElementById('new-user').value.trim();
            let p = document.getElementById('new-pass').value;
            let role = document.getElementById('new-role').value;
            let users = await DB.get('users', []);
            if(users.some(x => x.username === u)) return alert("Cet identifiant existe déjà !");
            users.push({ username: u, password: p, role: role, status: 'active', avatar: '🎓', mustChangePass: true, birthday: '2009-01-01' });
            await DB.set('users', users);
            alert("Compte créé avec succès !");
            render();
        }

        async function deleteUser(username) {
            if(!confirm(`Supprimer le compte de ${username} ?`)) return;
            let users = await DB.get('users', []);
            users = users.filter(x => x.username !== username);
            await DB.set('users', users);
            render();
        }

        async function toggleMaskUser(username) {
            let users = await DB.get('users', []);
            users = users.map(x => x.username === username ? {...x, status: x.status === 'masked' ? 'active' : 'masked'} : x);
            await DB.set('users', users);
            render();
        }

        async function adminResetPassword(username) {
            let newP = prompt(`Nouveau mot de passe provisoire pour ${username} :`);
            if(!newP) return;
            let users = await DB.get('users', []);
            users = users.map(x => x.username === username ? {...x, password: newP, mustChangePass: true} : x);
            await DB.set('users', users);
            alert("Mot de passe réinitialisé !");
            render();
        }

        async function toggleRole(username) {
            let users = await DB.get('users', []);
            users = users.map(x => x.username === username ? {...x, role: x.role === 'admin' ? 'student' : 'admin'} : x);
            await DB.set('users', users);
            render();
        }

        async function setTheme(themeName) {
            await DB.set('theme', themeName);
            applyThemeClass(themeName);
            render();
        }

        async function createCustomPage(e) {
            e.preventDefault();
            let title = document.getElementById('page-title').value.trim();
            let icon = document.getElementById('page-icon').value.trim() || 'book';
            let content = document.getElementById('page-content').value.trim();
            let customPages = await DB.get('custom_pages', []);
            customPages.push({ id: Date.now(), title, icon, content });
            await DB.set('custom_pages', customPages);
            alert("Page créée et publiée avec succès !");
            render();
        }

        async function deleteCustomPage(id) {
            if(!confirm("Supprimer cette page ?")) return;
            let customPages = await DB.get('custom_pages', []);
            customPages = customPages.filter(cp => cp.id !== id);
            await DB.set('custom_pages', customPages);
            render();
        }

        async function createQuizAdmin(e) {
            e.preventDefault();
            let title = document.getElementById('quiz-title-input').value;
            let q = document.getElementById('quiz-q-input').value;
            let opt0 = document.getElementById('quiz-opt0').value;
            let opt1 = document.getElementById('quiz-opt1').value;
            let opt2 = document.getElementById('quiz-opt2').value;

            let quizzes = await DB.get('quizzes', []);
            quizzes.push({
                id: Date.now(),
                title,
                questions: [{ q, options: [opt0, opt1, opt2], correct: 0 }]
            });
            await DB.set('quizzes', quizzes);
            alert("Quiz publié en ligne avec succès !");
            render();
        }

        async function deleteQuiz(id) {
            let quizzes = await DB.get('quizzes', []);
            quizzes = quizzes.filter(q => q.id !== id);
            await DB.set('quizzes', quizzes);
            render();
        }

        async function createPoll(e) {
            e.preventDefault();
            let q = document.getElementById('poll-question').value;
            let o1 = document.getElementById('poll-opt1').value;
            let o2 = document.getElementById('poll-opt2').value;
            let polls = await DB.get('polls', []);
            polls.push({ id: Date.now(), question: q, options: [{ text: o1, votes: [] }, { text: o2, votes: [] }] });
            await DB.set('polls', polls);
            alert("Sondage lancé !");
            render();
        }

        async function votePoll(pollId, optIndex) {
            let user = JSON.parse(localStorage.getItem('tmcv_current_user'));
            let polls = await DB.get('polls', []);
            polls = polls.map(p => {
                if (p.id === pollId) {
                    p.options.forEach(opt => { if (opt.votes) opt.votes = opt.votes.filter(v => v !== user.username); });
                    if (!p.options[optIndex].votes) p.options[optIndex].votes = [];
                    p.options[optIndex].votes.push(user.username);
                }
                return p;
            });
            await DB.set('polls', polls);
            render();
        }

        async function deletePoll(id) {
            let polls = await DB.get('polls', []);
            polls = polls.filter(p => p.id !== id);
            await DB.set('polls', polls);
            render();
        }

        initApp();
    </script>
